<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数独游戏 - Sudoku</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="game-container">
    <!-- Header: Game Info -->
    <header class="game-header">
      <div class="header-item">
        <span class="header-label">错误</span>
        <span class="header-value" id="error-count">0/3</span>
      </div>
      <div class="header-item">
        <span class="header-label">难度</span>
        <span class="header-value" id="difficulty">中等</span>
      </div>
      <div class="header-item">
        <span class="header-label">时间</span>
        <span class="header-value" id="timer">00:00</span>
      </div>
    </header>

    <!-- Sudoku Board -->
    <div class="board-container">
      <div class="sudoku-board" id="sudoku-board">
        <!-- 81 cells will be generated by JavaScript -->
      </div>
      <!-- Pause Overlay -->
      <div class="pause-overlay" id="pause-overlay">
        <span>游戏暂停</span>
        <button class="btn btn-primary" id="resume-btn">继续</button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button class="tool-btn" id="undo-btn" title="撤销 (Ctrl+Z)">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
        </svg>
        <span>撤销</span>
      </button>
      <button class="tool-btn" id="redo-btn" title="重做 (Ctrl+Y)">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/>
        </svg>
        <span>重做</span>
      </button>
      <button class="tool-btn" id="erase-btn" title="擦除 (Delete)">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.78-.78 2.05 0 2.83l3.85 3.85c.38.38.89.59 1.41.59h8.29c.53 0 1.04-.21 1.41-.59l4.86-4.86c.78-.78.78-2.05 0-2.83L12.55 3.59c-.39-.39-.9-.59-1.41-.59zm-2.49 14.41l-4.24-4.24 7.07-7.07 4.24 4.24-7.07 7.07z"/>
        </svg>
        <span>擦除</span>
      </button>
      <button class="tool-btn" id="pencil-btn" title="候选数标记">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
        </svg>
        <span>笔记</span>
      </button>
      <button class="tool-btn" id="hint-btn" title="提示">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/>
        </svg>
        <span>提示</span>
        <span class="hint-count" id="hint-count">3</span>
      </button>
    </div>

    <!-- Number Pad -->
    <div class="number-pad" id="number-pad">
      <button class="number-btn" data-number="1">1</button>
      <button class="number-btn" data-number="2">2</button>
      <button class="number-btn" data-number="3">3</button>
      <button class="number-btn" data-number="4">4</button>
      <button class="number-btn" data-number="5">5</button>
      <button class="number-btn" data-number="6">6</button>
      <button class="number-btn" data-number="7">7</button>
      <button class="number-btn" data-number="8">8</button>
      <button class="number-btn" data-number="9">9</button>
    </div>

    <!-- Game Controls -->
    <div class="game-controls">
      <button class="btn btn-secondary" id="new-game-btn">新游戏</button>
      <button class="btn btn-secondary" id="restart-btn">重新开始</button>
      <button class="btn btn-secondary" id="pause-btn">暂停</button>
    </div>

    <!-- Difficulty Modal -->
    <div class="modal" id="difficulty-modal">
      <div class="modal-content">
        <h2>选择难度</h2>
        <div class="difficulty-options">
          <button class="difficulty-btn" data-difficulty="easy">简单</button>
          <button class="difficulty-btn" data-difficulty="medium">中等</button>
          <button class="difficulty-btn" data-difficulty="hard">困难</button>
          <button class="difficulty-btn" data-difficulty="expert">专家</button>
        </div>
      </div>
    </div>

    <!-- Victory Modal -->
    <div class="modal" id="victory-modal">
      <div class="modal-content victory-content">
        <h2>🎉 恭喜完成！</h2>
        <div class="victory-stats">
          <p>用时：<span id="victory-time">00:00</span></p>
          <p>错误：<span id="victory-errors">0</span> 次</p>
          <p>难度：<span id="victory-difficulty">中等</span></p>
        </div>
        <button class="btn btn-primary" id="play-again-btn">再来一局</button>
      </div>
    </div>
  </div>

  <script src="js/sudoku.js"></script>
  <script src="js/history.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

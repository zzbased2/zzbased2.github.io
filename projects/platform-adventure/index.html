  $('mission-label').textContent = game.level.id === 5 ? `星光种子 ${game.seeds.size}/3 · 带回星门` : game.level.id === 3 ? `符文 ${game.puzzle}/3 · 月亮 → 星星 → 太阳` : `${game.friendFound ? '已找到伙伴' : '寻找新朋友'} · ${game.badgeFound ? '已找到秘密徽章' : '高处藏着秘密徽章'}`;
}
function recordProgress(complete = false) {
  const i = game.level.id, previous = save.records[i] || {};
  save.records[i] = { stars: Math.max(previous.stars || 0, game.collected.size), friend: !!previous.friend || game.friendFound, badge: !!previous.badge || game.badgeFound, complete: !!previous.complete || complete, time: complete ? (!previous.time || game.time < previous.time ? game.time : previous.time) : previous.time || 0 };
}
function onGameEvent(event) {
  sound.play(event.type);
  if (event.text) notify(event.text);
  if (['star', 'seed', 'friend', 'badge', 'checkpoint', 'rune'].includes(event.type)) { recordProgress(); capture(); }
  if (event.type === 'checkpoint') persist();
  if (event.type === 'win') {
    recordProgress(true); save.unlocked = Math.min(6, Math.max(save.unlocked, game.level.id + 2)); save.selected = Math.min(5, game.level.id + 1); save.active = null; persist();

    openModal(final ? '天空花园，为你盛开' : '又点亮了一个小世界', `<p class="mb-2 text-center text-xs tracking-[0.2em] text-[#bed1b2]">${final ? '你让所有的旅途，有了相遇的意义' : '把这一刻，夹进你的旅行手帐'}</p><p class="my-5 text-center font-serif text-2xl leading-10 text-[#efdbad]">${game.level.note}</p><div class="my-6 grid grid-cols-3 gap-3">${[[`${game.collected.size}/${game.level.stars.length}`, '找到的星光'], [game.friendFound ? game.level.friend.name : '等待下次相遇', '旅途伙伴'], [game.badgeFound ? '已收藏' : '还有秘密等你', '旅行徽章']].map(([v, l]) => `<div class="rounded-2xl bg-white/5 p-4 text-center"><p class="text-sm text-[#ead397]">${v}</p><p class="mt-2 text-[10px] text-[#9db8ae]">${l}</p></div>`).join('')}</div><p class="mb-6 text-center text-xs text-[#b9cfae]">${final ? '可以回到任意世界，寻找错过的朋友与星光。' : `旅行衣橱已解锁「${OUTFITS[Math.min(5, game.level.id + 1)].name}」。`}</p><div class="flex flex-wrap justify-center gap-3"><button data-action="${final ? 'collection' : 'next'}" class="${goldButton}">${final ? '翻开旅行手帐' : '去下一站'} ${icon('arrow-right-line')}</button><button data-action="retry" class="${softButton}">再探索一次</button><button data-action="home" class="${softButton}">返回地图</button></div>`);
  }
}
function pauseMenu() {
  if (!['playing', 'paused'].includes(game.state)) return;
  openModal('在这里，歇一歇', `<p class="mb-5 text-sm leading-7 text-[#b9cdc2]">风景不会走远，伙伴也会等你。当前收集和最近的灯笼检查点都会保留。</p><div class="grid gap-3 sm:grid-cols-2"><button data-action="close" class="${goldButton}">${icon('play-line')} 继续旅行</button><button data-action="assist" class="${softButton}">${icon('magic-line')} 请星光带我到下一盏灯</button><button data-action="retry-confirm" class="${softButton}">${icon('restart-line')} 重新探索这一站</button><button data-action="home" class="${softButton}">${icon('map-2-line')} 保存并返回地图</button></div><p class="mt-5 text-xs text-[#829f97]">引路不会自动收集物品，也不会跳过符文谜题。</p>`);
}
function howTo() {
  openModal('一张小小的冒险指南', `<div class="grid gap-3 sm:grid-cols-2">${[['方向键 / A D', '向左或向右移动'], ['空格 / ↑ / W', '跳跃；空中再次按下可连跳'], ['X / Shift · 第 3 站起', '朝面向的方向冲刺，落地恢复'], ['长按跳跃 · 第 3 站起', '下降时展开滑翔伞，慢慢落下'], ['贴墙 + 跳跃', '从墙面蹬出去，寻找新的路线'], ['E / 互动按钮', '靠近图书馆的符文后点亮'], ['Esc / P', '暂停，随时休息或查看地图'], ['触屏双指操作', '左侧移动，右侧跳跃或冲刺']].map(([k, v]) => `<div class="rounded-xl bg-white/5 p-4"><p class="mb-2 text-sm text-[#ecd49b]">${k}</p><p class="text-xs leading-6 text-[#b8cbbf]">${v}</p></div>`).join('')}</div><p class="mt-5 text-sm leading-7 text-[#b3c5ba]">轻松探索提供三段跳、较慢的移动障碍和更宽松的收集范围；标准冒险提供二段跳。点亮灯笼后即可从那里重新出发，已收集的星光不会丢失。</p><button data-action="close" class="${goldButton} mt-5 w-full">知道啦</button>`);
}
function settings() {
  openModal('按你的节奏旅行', `<div class="space-y-6"><div><p class="mb-3 text-sm text-[#d5dfc2]">下一次出发的难度</p><div class="grid gap-3 sm:grid-cols-2">${Object.entries(MODES).map(([id, mode]) => `<button data-action="mode" data-mode="${id}" aria-pressed="${save.mode === id}" class="rounded-xl border ${save.mode === id ? 'border-[#d5d89f] bg-[#a2bf9c]/10' : 'border-white/10'} p-4 text-left"><span class="text-sm text-[#efdab0]">${mode.name}</span><span class="mt-2 block text-xs leading-6 text-[#aabfb1]">${id === 'explore' ? '三段跳 · 更容易收集 · 机关更宽容' : '二段跳 · 标准机关 · 适度挑战'}</span></button>`).join('')}</div><p class="mt-2 text-xs text-[#849f97]">难度在下一次开始或继续关卡时生效，不会重置收藏。</p></div><button data-action="setting-sound" class="flex w-full items-center justify-between rounded-xl bg-white/5 p-4 text-sm"><span>轻柔音乐与音效</span><span class="text-[#e9d294]">${save.sound ? '已开启' : '已关闭'}</span></button><button data-action="reduced" class="flex w-full items-center justify-between rounded-xl bg-white/5 p-4 text-sm"><span>减少环境动画与粒子</span><span class="text-[#e9d294]">${save.reduced ? '已开启' : '已关闭'}</span></button><div class="border-t border-white/10 pt-4"><p class="mb-3 text-xs leading-6 text-[#94aea4]">存档仅保存在此浏览器，不上传个人信息。清除浏览器数据会清除进度。</p><button data-action="reset-confirm" class="text-xs text-[#d2a3a3]">重新开始整段旅程</button></div></div>`);
}
function collection(tab = collectionTab) {
  collectionTab = tab;
  const friends = tab === 'friends';
  const items = friends ? WORLDS : OUTFITS;
  openModal('我的旅行手帐', `<div class="mb-5 flex gap-3"><button data-action="friends" class="${friends ? goldButton : softButton}">伙伴与纪念</button><button data-action="outfits" class="${friends ? softButton : goldButton}">旅行衣橱</button></div><div class="grid grid-cols-2 gap-3 lg:grid-cols-3">${items.map((item, i) => {
    const r = save.records[i] || {}, found = friends ? !!r.friend : save.unlocked > item.need;
    const selected = friends ? save.companion === i : save.outfit === i;
    return `<div class="rounded-2xl border ${selected && found ? 'border-[#c9d8a4]/60' : 'border-white/10'} bg-white/5 p-4 text-center"><canvas width="220" height="140" data-portrait="${i}" data-kind="${tab}" class="mx-auto h-24 w-full ${found ? '' : 'opacity-25'}" aria-hidden="true"></canvas><p class="text-sm ${found ? 'text-[#e9d8ae]' : 'text-[#92aaa2]'}">${friends ? item.friend : item.name}</p><p class="mt-2 text-[10px] leading-5 text-[#a4b8aa]">${friends ? `${item.name} · ${r.badge ? '秘密徽章已收藏' : '秘密徽章待发现'}` : i === 0 ? '旅行开始时拥有' : `完成第 ${i} 站解锁`}</p><button data-action="${friends ? 'companion' : 'outfit'}" data-id="${i}" ${!found ? 'disabled' : ''} class="mt-3 text-xs text-[#d9dba8] disabled:text-[#758f88]">${!found ? (friends ? '在高处找到我' : '尚未解锁') : selected ? '正在同行' : friends ? '一起出发' : '换上这套'}</button></div>`;
  }).join('')}</div><p class="mt-5 text-xs leading-6 text-[#8eaaa0]">${friends ? '米露会在旅途开始时陪伴你。找到关卡高处的伙伴后，就能邀请它们同行。收藏没有期限，不用急着集齐。' : '所有装扮通过冒险解锁，没有购买，也没有随机抽取。'}</p>${game.state === 'won' ? `<button data-action="home" class="${goldButton} mt-5 w-full">回到星光地图</button>` : ''}`);
  document.querySelectorAll('[data-portrait]').forEach(el => {
    const c = el.getContext('2d'), i = Number(el.dataset.portrait);
    if (friends) drawFriend(c, 110, 82, WORLDS[i].species, 0, 2);
    else drawHero(c, 96, 46, i, 0, false, 1, false, 1.5);
  });
}
const actions = {
  start: () => beginLevel(save.active?.level ?? save.selected, true),
  home: showHome,
  map: () => {
    if (game.state === 'home') $('world-map').scrollIntoView({ behavior: save.reduced ? 'instant' : 'smooth' });
    else { openModal('选择下一段风景', `<div class="grid grid-cols-2 gap-3 lg:grid-cols-3">${worldCards(true)}</div><p class="mt-5 text-xs text-[#9bb4a9]">选择关卡会从该关起点出发。手帐收藏不会丢失。</p>`); paintThumbnails(); }
  },
  level: b => beginLevel(Number(b.dataset.id)),
  close: closeModal, pause: pauseMenu, howto: howTo, settings,
  hint: () => notify(game.level.tip),
  next: () => beginLevel(Math.min(5, game.level.id + 1)),
  retry: () => beginLevel(game.level.id),
  'retry-confirm': () => openModal('重新出发？', `<p class="mb-6 text-sm leading-7 text-[#c7d8cb]">会从这一站的起点重新开始，本次灯笼位置会重置。已经记入旅行手帐的收藏不会丢失。</p><div class="flex gap-3"><button data-action="retry" class="${goldButton}">重新出发</button><button data-action="close" class="${softButton}">继续当前旅程</button></div>`),
  assist: () => { closeModal(); game.assist(); capture(); persist(); },
  sound: () => { save.sound = !save.sound; sound.setEnabled(save.sound); syncSound(); persist(); },
  'setting-sound': () => { actions.sound(); settings(); },
  reduced: () => { save.reduced = !save.reduced; persist(); settings(); },
  mode: b => { const mode = b.dataset.mode; if (Object.hasOwn(MODES, mode)) { save.mode = mode; persist(); settings(); } },
  collection: () => collection(), friends: () => collection('friends'), outfits: () => collection('outfits'),
  companion: b => { const i = Number(b.dataset.id); if (save.records[i]?.friend) { save.companion = i; persist(); collection('friends'); } },
  outfit: b => { const i = Number(b.dataset.id); if (OUTFITS[i] && save.unlocked > OUTFITS[i].need) { save.outfit = i; persist(); collection('outfits'); } },
  fullscreen: async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else if ($('stage').requestFullscreen) await $('stage').requestFullscreen(); else notify('当前浏览器不支持全屏，横屏游玩会更舒适。'); } catch { notify('当前预览不允许全屏，横屏游玩也很舒适。'); } },
  'reset-confirm': () => openModal('清空这本旅行手帐？', `<p class="mb-6 text-sm leading-7 text-[#d4c5bc]">这会删除此浏览器中的所有关卡进度、伙伴和收藏，无法撤销。确定要从第一站重新开始吗？</p><div class="flex gap-3"><button data-action="reset" class="${softButton} text-[#e0abab]">确认清空</button><button data-action="close" class="${goldButton}">保留我的旅程</button></div>`),
  reset: () => { save = blankSave(); game.state = 'home'; persist(); sound.setEnabled(true); syncSound(); showHome(); notify('新的旅行手帐已经准备好了。'); }
};
document.addEventListener('click', e => {
  const button = e.target.closest('[data-action]');
  if (!button || button.disabled) return;
  if (save.sound) sound.unlock();
  const action = actions[button.dataset.action]; if (action) action(button);
});
modal.addEventListener('cancel', e => { e.preventDefault(); closeModal(); });
modal.addEventListener('click', e => { if (e.target === modal) { const r = modal.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeModal(); } });
window.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (modal.open) { if (e.code === 'KeyP') { e.preventDefault(); closeModal(); } return; }
    if (game.state === 'playing') { e.preventDefault(); pauseMenu(); } return;
  }
  if (modal.open || game.state !== 'playing' || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const key = keyMap[e.code];
  if (key) { e.preventDefault(); if (!heldCodes.has(e.code)) { heldCodes.add(e.code); game.press(key); } }
});
window.addEventListener('keyup', e => {
  heldCodes.delete(e.code);
  const key = keyMap[e.code];
  if (key && ![...heldCodes].some(code => keyMap[code] === key) && ![...pointerKeys.values()].includes(key)) game.release(key);
});
document.querySelectorAll('[data-key]').forEach(button => {
  button.addEventListener('pointerdown', e => {
    if (game.state !== 'playing' || modal.open) return;

  });
  const up = e => { const key = pointerKeys.get(e.pointerId); pointerKeys.delete(e.pointerId); if (key && ![...pointerKeys.values()].includes(key) && ![...heldCodes].some(code => keyMap[code] === key)) game.release(key); };

function onFocusLost() { resetInput(); if (game.state === 'playing') pauseMenu(); capture(); if (dirty) persist(); }
window.addEventListener('blur', onFocusLost);

const coarse = window.matchMedia('(pointer: coarse)');
const narrowScreen = window.matchMedia('(max-width: 900px)');
function updateTouch() {
  const show = coarse.matches || navigator.maxTouchPoints > 0 || narrowScreen.matches;
  $('touch-controls').classList.toggle('hidden', !show);
}
coarse.addEventListener?.('change', updateTouch);
narrowScreen.addEventListener?.('change', updateTouch);
window.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') $('touch-controls').classList.remove('hidden'); }, { passive: true });
updateTouch();
let lastFrame = 0, accumulator = 0;
function frame(now) {
  const delta = lastFrame ? Math.min(0.08, (now - lastFrame) / 1000) : 0;
  lastFrame = now;
  if (!document.hidden) {
    accumulator += delta;
    while (accumulator >= 1 / 120) { game.step(1 / 120); accumulator -= 1 / 120; }
    painter.render(game, save); sound.update(delta, game.state === 'playing');
    hudTick += delta; saveElapsed += delta;
    if (hudTick > 0.1) { if (game.state !== 'home') updateHud(); hudTick = 0; }
    if (saveElapsed > 1.5) { if (dirty) persist(); saveElapsed = 0; }
  } else accumulator = 0;

}
syncSound(); showHome(); requestAnimationFrame(frame);

</script>

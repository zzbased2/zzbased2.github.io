<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="元宵合合：把相同口味的元宵丢进灯会小锅，碰在一起就会合成更大的一颗。">
<title>元宵合合</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 0%, #4a1c2a 0%, #140910 72%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Nunito", sans-serif;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #stage {
    position: relative;
    width: min(100vw, 480px, calc(100vh * 0.6));
    aspect-ratio: 3 / 5;
    border-radius: clamp(0px, calc((100vw - 480px) * 999), 26px);
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 220, 170, 0.16);
    background: #1a0c12;
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }

  .hud-bar {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; z-index: 5; gap: 8px;
  }
  .wish {
    position: absolute; top: 56px; left: 50%; transform: translateX(-50%);
    z-index: 5; pointer-events: none;
    max-width: calc(100% - 24px);
    background: rgba(255, 248, 236, 0.94);
    color: #6b3034; font-weight: 800; font-size: 14px;
    padding: 6px 14px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 6px 16px rgba(40, 8, 12, 0.12);
  }
  .wish.hidden { display: none; }
  .hud-pill {
    pointer-events: auto;
    background: rgba(255, 248, 236, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 6px 12px;
    border-radius: 999px;
    color: #5c2e32;
    font-weight: 800;
    font-size: 14px;
    box-shadow: 0 6px 18px rgba(40, 8, 12, 0.16);
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .hud-pill b { font-size: 16px; }
  #hud-combo {
    color: #d4531c;
    min-width: 0;
  }
  #hud-combo:empty { display: none; }
  .hud-right { display: flex; gap: 8px; pointer-events: auto; align-items: center; }
  .next-wrap {
    pointer-events: auto;
    display: flex; align-items: center; gap: 6px;
    background: rgba(255, 248, 236, 0.9);
    border-radius: 999px;
    padding: 4px 8px 4px 10px;
    box-shadow: 0 6px 18px rgba(40, 8, 12, 0.16);
  }
  .next-wrap.hidden { display: none; }
  .next-label { font-size: 11px; font-weight: 800; color: #8a5a52; }
  .orb {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 900;
    box-shadow: inset 0 -3px 5px rgba(0,0,0,0.16), 0 2px 6px rgba(0,0,0,0.12);
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(255, 248, 236, 0.92);
    color: #5c2e32; font-size: 16px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(40, 8, 12, 0.16);
    display: grid; place-items: center;
    text-decoration: none;
  }
  .icon-btn:active { transform: scale(0.94); }

  .overlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
    background: rgba(28, 8, 12, 0.46);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
  }
  .overlay.hidden { display: none; }
  .card {
    width: 100%; max-width: 400px;
    max-height: 100%;
    overflow: auto;
    background: linear-gradient(180deg, rgba(255,251,245,0.98), rgba(255,244,232,0.98));
    border-radius: 28px;
    padding: 16px 14px 14px;
    text-align: center;
    color: #4e2a2e;
    box-shadow: 0 22px 60px rgba(24, 6, 10, 0.35), inset 0 1px 0 #fff;
    border: 2px solid rgba(255, 255, 255, 0.85);
  }
  .badge {
    display: inline-block;
    padding: 4px 12px; border-radius: 999px;
    background: #ffe8d2; color: #c2410c;
    font-size: 12px; font-weight: 800; letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .card h1 {
    font-size: 32px; line-height: 1.15; margin-bottom: 4px;
    background: linear-gradient(135deg, #e11d48 0%, #f97316 55%, #eab308 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 900;
  }
  .card h2 { font-size: 26px; margin-bottom: 4px; color: #6b2430; font-weight: 900; }
  .subtitle { font-size: 13px; color: #8d5c58; line-height: 1.5; margin-bottom: 8px; }

  .evo {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 1px; margin: 4px 0 12px; overflow-x: auto;
  }
  .evo-item { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; flex: 1; }
  .evo-orb {
    width: 18px; height: 18px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 9px; font-weight: 900;
    box-shadow: inset 0 -2px 3px rgba(0,0,0,0.15);
  }
  .evo-item span:last-child { font-size: 8px; color: #9a6a64; font-weight: 700; white-space: nowrap; }
  .evo-arrow { color: #e7b8a4; font-size: 12px; margin-top: 4px; }

  .primary-btn, .secondary-btn {
    width: 100%; border: none; cursor: pointer;
    border-radius: 999px; font-weight: 900;
    display: block; text-decoration: none; text-align: center;
  }
  .primary-btn {
    padding: 11px 18px; font-size: 17px; color: #fff;
    background: linear-gradient(135deg, #f43f5e 0%, #fb7185 40%, #fb923c 100%);
    box-shadow: 0 10px 24px rgba(244, 63, 94, 0.32);
  }
  .primary-btn:active { transform: translateY(1px); }
  .secondary-btn {
    margin-top: 6px; padding: 8px 14px;
    font-size: 14px; color: #b4534a;
    background: #fff; border: 2px solid #ffd7c8;
  }
  .tips-box {
    margin-top: 8px; padding: 8px 10px;
    background: #fff4ea; border-radius: 16px;
    text-align: left; font-size: 12px; color: #7c534c; line-height: 1.55;
  }
  .tips-box strong { color: #6b2d32; }
  .best-line { font-size: 13px; color: #b45309; font-weight: 800; margin-bottom: 6px; }

  .stats-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin: 8px 0 12px;
  }
  .stat-card { background: #fff1e6; border-radius: 16px; padding: 10px 4px; }
  .stat-val { font-size: 22px; font-weight: 900; color: #e11d48; }
  .stat-lbl { font-size: 11px; color: #a16b62; margin-top: 2px; font-weight: 700; }

  .touch-controls {
    position: absolute; bottom: 12px; left: 12px; right: 12px;
    display: none; justify-content: space-between; align-items: flex-end;
    z-index: 8; pointer-events: none;
  }
  @media (pointer: coarse), (max-width: 640px) {
    .touch-controls.show { display: flex; }
  }
  .touch-group { display: flex; gap: 10px; pointer-events: auto; }
  .t-btn {
    width: 58px; height: 58px; border-radius: 50%;
    border: 2px solid rgba(255,236,214,0.8);
    background: rgba(255,248,236,0.55);
    backdrop-filter: blur(8px);
    color: #6b2d32; font-size: 22px; font-weight: 900;
    box-shadow: 0 8px 18px rgba(40, 10, 16, 0.16);
    pointer-events: auto;
  }
  .t-btn.drop {
    width: 74px; height: 74px; border-radius: 24px;
    background: linear-gradient(160deg, rgba(251,113,133,0.92), rgba(249,115,22,0.92));
    color: white; font-size: 15px; letter-spacing: 0.04em;
  }
  .t-btn:active { transform: scale(0.94); }
  button:focus-visible, a:focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="元宵合合游戏画面"></canvas>

  <div class="wish hidden" id="wish">🦊 小狐想吃抹茶</div>
  <div class="hud-bar">
    <div class="hud-pill">🏮 <b id="hud-score">0</b> <span id="hud-combo"></span></div>
    <div class="hud-right">
      <div class="next-wrap hidden" id="next-wrap">
        <span class="next-label">下一颗</span>
        <span class="orb" id="next-orb">芝</span>
      </div>
      <button class="icon-btn" id="mute-btn" type="button" title="音效开关">🔊</button>
      <a href="../" class="icon-btn" title="返回项目列表">🏠</a>
    </div>
  </div>

  <div class="overlay" id="start-overlay">
    <div class="card">
      <span class="badge">🏮 灯会小锅 · 合成</span>
      <h1>元宵合合</h1>
      <p class="subtitle">相同口味碰到一起，就会合成更大的一颗。</p>
      <div class="best-line" id="menu-best">最高分 0 · 圆满 0 次</div>
      <div class="evo" id="evo"></div>
      <button class="primary-btn" id="start-btn" type="button">开锅！</button>
      <a class="secondary-btn" href="../">返回项目列表</a>
      <div class="tips-box">
        <div>🥢 拖动瞄准，松手落下。键盘 <b>← →</b> 移动，<b>空格</b> 放下。</div>
        <div>🍡 两颗一样的合成下一种，连着合成会加分。</div>
        <div>🦊 做出客人想吃的口味，有额外心意分。</div>
        <div>🌙 中心越过锅里的虚线就会满锅。两颗桂花相遇会圆满绽开。</div>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="pause-overlay">
    <div class="card">
      <span class="badge">🫖 小憩</span>
      <h2>先盛一盛</h2>
      <p class="subtitle">锅还热着，元宵在等你。</p>
      <button class="primary-btn" id="resume-btn" type="button">继续合成</button>
    </div>
  </div>

  <div class="overlay hidden" id="over-overlay">
    <div class="card">
      <span class="badge" id="over-badge">🏮 这锅煮好了</span>
      <h2 id="over-title">锅沿守不住啦</h2>
      <p class="subtitle" id="over-line">再煮一锅，味道会更圆。</p>
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-val" id="final-score">0</div>
          <div class="stat-lbl">本锅得分</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="final-best">0</div>
          <div class="stat-lbl">历史最高</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="final-merges">0</div>
          <div class="stat-lbl">合成次数</div>
        </div>
      </div>
      <p class="subtitle" id="final-detail"></p>
      <button class="primary-btn" id="retry-btn" type="button">再煮一锅</button>
      <button class="secondary-btn" id="menu-btn" type="button">回灯会门口</button>
    </div>
  </div>

  <div class="touch-controls" id="touch-controls">
    <div class="touch-group">
      <button class="t-btn" id="btn-left" type="button" aria-label="向左">◀</button>
      <button class="t-btn" id="btn-right" type="button" aria-label="向右">▶</button>
    </div>
    <button class="t-btn drop" id="btn-drop" type="button">放下</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const W = 480, H = 800;
  const LEFT = 48, RIGHT = 432, FLOOR = 676;
  const RIM = 188, DANGER = 210, DROP_Y = 248;

  const TIERS = [
    { name: '芝麻', mark: '芝', r: 16, score: 2,   fill: '#5c4034', shade: '#2d2118', gloss: '#d7bfa8', ink: '#fff8f0' },
    { name: '花生', mark: '花', r: 21, score: 4,   fill: '#f0d2a0', shade: '#d2a86a', gloss: '#fff6e4', ink: '#6a4520' },
    { name: '玫瑰', mark: '玫', r: 27, score: 8,   fill: '#ef6d8a', shade: '#c44768', gloss: '#ffd6e2', ink: '#fff' },
    { name: '抹茶', mark: '茶', r: 34, score: 16,  fill: '#6fbf73', shade: '#3d8d49', gloss: '#e7f8dc', ink: '#14361c' },
    { name: '芋泥', mark: '芋', r: 43, score: 32,  fill: '#b794e0', shade: '#7d58b0', gloss: '#f6e9ff', ink: '#fff' },
    { name: '草莓', mark: '莓', r: 53, score: 64,  fill: '#ff5a6a', shade: '#d43348', gloss: '#ffe3e7', ink: '#fff' },
    { name: '芒果', mark: '芒', r: 65, score: 128, fill: '#ffb703', shade: '#e08900', gloss: '#fff3c4', ink: '#5c3d00' },
    { name: '桂花', mark: '桂', r: 78, score: 256, fill: '#ffe08a', shade: '#e8b423', gloss: '#fffceb', ink: '#6a4a00' }
  ];
  const GUESTS = [
    { face: '🦊', name: '小狐' },
    { face: '🐰', name: '团圆' },
    { face: '🐼', name: '糯糯' },
    { face: '🐱', name: '灯灯' },
    { face: '🐥', name: '桂桂' }
  ];
  const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 987.77, 1174.66, 1318.51];
  const BAG = [0, 0, 0, 0, 1, 1, 1, 2, 2, 3];
  const SAVE_KEY = 'yuanxiao_merge_v1';

  const hudScore = document.getElementById('hud-score');
  const hudCombo = document.getElementById('hud-combo');
  const wishEl = document.getElementById('wish');
  const nextWrap = document.getElementById('next-wrap');
  const nextOrb = document.getElementById('next-orb');
  const muteBtn = document.getElementById('mute-btn');
  const touchControls = document.getElementById('touch-controls');
  const startOverlay = document.getElementById('start-overlay');
  const pauseOverlay = document.getElementById('pause-overlay');
  const overOverlay = document.getElementById('over-overlay');

  let save = { best: 0, blooms: 0, muted: false };
  try { save = { ...save, ...JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') }; } catch (e) {}
  function persist() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
  }

  let audioCtx = null;
  function ensureAudio() {
    if (save.muted) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx && AC) audioCtx = new AC();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, dur, type, vol, delay) {
    if (save.muted || !audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function chime(tier) {
    const f = SCALE[Math.min(tier, SCALE.length - 1)];
    tone(f, 0.16, 'sine', 0.07);
    tone(f * 1.5, 0.12, 'triangle', 0.025);
  }

  let state = 'menu';
  let balls = [];
  let particles = [];
  let floaters = [];
  let steams = [];
  let holdTier = 0;
  let nextTier = 1;
  let aimX = W / 2;
  let holdX = W / 2;
  let dropLock = 0;
  let score = 0;
  let combo = 1;
  let lastMergeAt = -1e9;
  let merges = 0;
  let runBlooms = 0;
  let maxTier = 0;
  let bestAtStart = 0;
  let order = null;
  let seen = new Set();
  let recent = [];
  let shake = 0;
  let threatening = false;
  let warnAt = 0;
  let shownNext = -1;
  let aiming = false;
  const keys = { left: false, right: false };

  const stars = Array.from({ length: 26 }, () => ({
    x: Math.random() * W,
    y: 18 + Math.random() * 150,
    s: 0.6 + Math.random() * 1.3,
    p: Math.random() * Math.PI * 2
  }));

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function roll() {
    let tier = BAG[Math.floor(Math.random() * BAG.length)];
    let guard = 0;
    while (recent.length >= 2 && recent[0] === recent[1] && recent[1] === tier && guard++ < 5) {
      tier = BAG[Math.floor(Math.random() * BAG.length)];
    }
    recent.push(tier);
    if (recent.length > 2) recent.shift();
    return tier;
  }
  function pickOrder() {
    const guest = GUESTS[Math.floor(Math.random() * GUESTS.length)];
    const bag = [2, 2, 2, 3, 3, 3, 4, 4, 5, 6];
    return { guest, tier: bag[Math.floor(Math.random() * bag.length)] };
  }
  function makeBall(tier, x, y, vx, vy) {
    return { tier, x, y, vx, vy, r: TIERS[tier].r, age: 0, over: 0, dead: false };
  }
  function clampX(x, tier) {
    const r = TIERS[tier].r;
    return Math.max(LEFT + r + 2, Math.min(RIGHT - r - 2, x));
  }
  function popup(x, y, text, color) {
    floaters.push({ x, y, text, color: color || '#fff6d8', age: 0, life: 0.95 });
  }
  function puff(x, y, color, n, speed) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed * (0.35 + Math.random());
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - speed * 0.25,
        life: 0.32 + Math.random() * 0.38,
        age: 0,
        r: 1.6 + Math.random() * 2.6,
        color
      });
    }
    if (particles.length > 200) particles.splice(0, particles.length - 200);
  }

  function contain(b) {
    if (b.x - b.r < LEFT) { b.x = LEFT + b.r; b.vx = Math.abs(b.vx) * 0.22; }
    if (b.x + b.r > RIGHT) { b.x = RIGHT - b.r; b.vx = -Math.abs(b.vx) * 0.22; }
    if (b.y + b.r > FLOOR) {
      b.y = FLOOR - b.r;
      if (b.vy > 0) b.vy *= -0.14;
      b.vx *= 0.78;
      if (Math.abs(b.vy) < 18) b.vy = 0;
      if (Math.abs(b.vx) < 8) b.vx = 0;
    }
    if (b.y - b.r < 24) { b.y = 24 + b.r; if (b.vy < 0) b.vy *= -0.1; }
  }

  function integrate(b, h) {
    b.vy += 1750 * h;
    b.vx *= (1 - 1.8 * h);
    b.vy *= (1 - 0.12 * h);
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > 980) { b.vx *= 980 / sp; b.vy *= 980 / sp; }
    b.x += b.vx * h;
    b.y += b.vy * h;
    b.age += h;
    contain(b);
    if (b.y + b.r >= FLOOR - 0.5 && Math.hypot(b.vx, b.vy) < 16) {
      b.vx = 0;
      b.vy = 0;
    }
  }

  function solveContact(a, b, merges, pops) {
    let dx = b.x - a.x;
    let dy = b.y - a.y;
    let distSq = dx * dx + dy * dy;
    const min = a.r + b.r;
    if (distSq < 1e-6) { dx = 1; dy = 0; distSq = 1; }
    if (distSq >= min * min) return;
    const dist = Math.sqrt(distSq);
    const nx = dx / dist;
    const ny = dy / dist;
    const overlap = min - dist;
    const ma = a.r * a.r;
    const mb = b.r * b.r;
    const corr = Math.max(overlap - 0.4, 0) * 0.72;
    a.x -= nx * corr * (mb / (ma + mb));
    a.y -= ny * corr * (mb / (ma + mb));
    b.x += nx * corr * (ma / (ma + mb));
    b.y += ny * corr * (ma / (ma + mb));
    const rvn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (rvn < 0) {
      const j = -(1.08) * rvn / (1 / ma + 1 / mb);
      a.vx -= j * nx / ma;
      a.vy -= j * ny / ma;
      b.vx += j * nx / mb;
      b.vy += j * ny / mb;
      a.vx *= 0.996;
      b.vx *= 0.996;
    }
    if (a.tier !== b.tier || a.dead || b.dead) return;
    if (a.tier === TIERS.length - 1) {
      const rel = Math.hypot(a.vx - b.vx, a.vy - b.vy);
      if (rel < 260 && a.age > 0.18 && b.age > 0.18) {
        a.dead = b.dead = true;
        pops.push([a, b]);
      }
      return;
    }
    a.dead = b.dead = true;
    merges.push([a, b]);
  }

  function awardMerge(tier, x, y) {
    const now = performance.now();
    if (now - lastMergeAt < 1200) combo += 1;
    else combo = 1;
    lastMergeAt = now;
    const gained = TIERS[tier].score * combo;
    score += gained;
    merges += 1;
    if (tier > maxTier) maxTier = tier;
    if (score > save.best) { save.best = score; persist(); }
    chime(tier);
    shake = Math.min(16, shake + 4 + tier * 0.4);
    puff(x, y, TIERS[tier].fill, 10 + tier, 90 + tier * 10);
    popup(x, y - 16, combo >= 2 ? `+${gained}  ×${combo}` : `+${gained}`, '#fff4c8');
    if (!seen.has(tier)) {
      seen.add(tier);
      popup(x, y - 40, TIERS[tier].name + '元宵', '#ffe1ea');
    }
    if (order && tier === order.tier) {
      const bonus = 90 * (tier + 1);
      score += bonus;
      if (score > save.best) { save.best = score; persist(); }
      popup(W / 2, 150, `${order.guest.face} 心意 +${bonus}`, '#ffe08a');
      tone(880, 0.12, 'sine', 0.06);
      tone(1174, 0.16, 'sine', 0.05, 0.08);
      tone(1568, 0.2, 'triangle', 0.04, 0.16);
      order = pickOrder();
    }
  }

  function fuse(a, b) {
    const tier = a.tier + 1;
    const ball = makeBall(
      tier,
      (a.x + b.x) / 2,
      (a.y + b.y) / 2,
      (a.vx + b.vx) * 0.12,
      Math.min(-10, (a.vy + b.vy) * 0.1)
    );
    contain(ball);
    balls.push(ball);
    if (state === 'play') awardMerge(tier, ball.x, ball.y);
  }

  function bloom(a, b) {
    const x = (a.x + b.x) / 2;
    const y = (a.y + b.y) / 2;
    if (state !== 'play') return;
    const now = performance.now();
    if (now - lastMergeAt < 1200) combo += 1;
    else combo = 1;
    lastMergeAt = now;
    const gained = 640 * combo;
    score += gained;
    runBlooms += 1;
    save.blooms += 1;
    if (score > save.best) save.best = score;
    persist();
    shake = 18;
    puff(x, y, '#ffe08a', 36, 180);
    puff(x, y, '#fff', 16, 120);
    popup(x, y, `圆满 +${gained}`, '#fff1a8');
    [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, 'sine', 0.06, i * 0.07));
  }

  function physics(dt) {
    const steps = 4;
    const h = dt / steps;
    for (let s = 0; s < steps; s++) {
      for (const b of balls) integrate(b, h);
      const merges = [];
      const pops = [];
      for (let i = 0; i < balls.length; i++) {
        const a = balls[i];
        if (a.dead) continue;
        for (let j = i + 1; j < balls.length; j++) {
          const b = balls[j];
          if (b.dead) continue;
          solveContact(a, b, merges, pops);
        }
      }
      if (merges.length || pops.length) {
        for (const pair of merges) fuse(pair[0], pair[1]);
        for (const pair of pops) bloom(pair[0], pair[1]);
        balls = balls.filter((b) => !b.dead);
      }
      for (const b of balls) contain(b);
    }
  }

  function blocked() {
    const r = TIERS[holdTier].r;
    return balls.some((b) => {
      const dx = b.x - holdX;
      const dy = b.y - DROP_Y;
      const reach = b.r + r + 3;
      return dx * dx + dy * dy < reach * reach;
    });
  }
  function canDropNow() {
    return state === 'play' && dropLock <= 0 && !blocked();
  }
  function tryDrop() {
    if (!canDropNow()) return;
    ensureAudio();
    const tier = holdTier;
    const ball = makeBall(tier, holdX, DROP_Y, 0, 90);
    balls.push(ball);
    puff(holdX, DROP_Y, '#fff6e4', 6, 40);
    tone(210, 0.06, 'triangle', 0.04);
    holdTier = nextTier;
    nextTier = roll();
    shownNext = -1;
    dropLock = 0.36;
    paintNext();
  }

  function checkDanger(dt) {
    threatening = false;
    for (const b of balls) {
      if (b.y < DANGER && b.age > 0.4) {
        b.over += dt;
        threatening = true;
        if (b.over > 1.35) { lose(); return; }
      } else b.over = 0;
    }
    if (threatening && performance.now() - warnAt > 700) {
      warnAt = performance.now();
      tone(320, 0.08, 'triangle', 0.03);
    }
  }

  function startGame() {
    ensureAudio();
    balls = [];
    particles = [];
    floaters = [];
    score = 0;
    combo = 1;
    lastMergeAt = -1e9;
    merges = 0;
    runBlooms = 0;
    maxTier = 0;
    seen = new Set();
    recent = [];
    bestAtStart = save.best;
    order = pickOrder();
    holdTier = roll();
    nextTier = roll();
    shownNext = -1;
    aimX = holdX = W / 2;
    dropLock = 0.25;
    shake = 0;
    threatening = false;
    state = 'play';
    startOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    paintNext();
    paintHud();
  }

  function lose() {
    if (state !== 'play') return;
    state = 'over';
    tone(392, 0.14, 'sine', 0.05);
    tone(311, 0.18, 'sine', 0.04, 0.1);
    tone(247, 0.24, 'triangle', 0.04, 0.2);
    const record = score > bestAtStart && score > 0;
    document.getElementById('over-badge').textContent = record ? '✨ 新纪录' : '🏮 这锅煮好了';
    document.getElementById('over-title').textContent = record ? '今晚最圆的一锅' : '元宵漫过锅沿啦';
    const tierName = TIERS[maxTier] ? TIERS[maxTier].name : '芝麻';
    document.getElementById('over-line').textContent = record
      ? '热气、甜味和连消都记在这只小锅里了。'
      : (maxTier >= 5 ? '大颗的甜味已经飘出灯会了。' : '锅还热着，再煮一锅就会更顺。');
    document.getElementById('final-score').textContent = String(score);
    document.getElementById('final-best').textContent = String(save.best);
    document.getElementById('final-merges').textContent = String(merges);
    document.getElementById('final-detail').textContent =
      `最大的是${tierName}元宵${runBlooms ? ` · 圆满 ${runBlooms} 次` : ''}`;
    overOverlay.classList.remove('hidden');
    paintMenuBest();
  }

  function openMenu() {
    state = 'menu';
    balls = [];
    overOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
    paintMenuBest();
  }
  function togglePause() {
    if (state === 'play') {
      state = 'pause';
      pauseOverlay.classList.remove('hidden');
    } else if (state === 'pause') {
      state = 'play';
      pauseOverlay.classList.add('hidden');
    }
  }

  function paintMenuBest() {
    document.getElementById('menu-best').textContent = `最高分 ${save.best} · 圆满 ${save.blooms} 次`;
  }
  function paintMute() { muteBtn.textContent = save.muted ? '🔇' : '🔊'; }
  function paintNext() {
    if (shownNext === nextTier) return;
    shownNext = nextTier;
    const t = TIERS[nextTier];
    nextOrb.textContent = t.mark;
    nextOrb.style.background = `radial-gradient(circle at 35% 32%, ${t.gloss}, ${t.fill} 55%, ${t.shade})`;
    nextOrb.style.color = t.ink;
  }
  function paintHud() {
    hudScore.textContent = String(score);
    const hot = state === 'play' && combo >= 2 && performance.now() - lastMergeAt < 1100;
    hudCombo.textContent = hot ? `连消 ×${combo}` : '';
    nextWrap.classList.toggle('hidden', state !== 'play');
    touchControls.classList.toggle('show', state === 'play');
    if (state === 'play' && order) {
      const t = TIERS[order.tier];
      const text = `${order.guest.face} ${order.guest.name}想吃${t.name}`;
      if (wishEl.textContent !== text) wishEl.textContent = text;
      wishEl.classList.remove('hidden');
    } else {
      wishEl.classList.add('hidden');
    }
  }

  function buildEvo() {
    const evo = document.getElementById('evo');
    evo.innerHTML = TIERS.map((t, i) => (
      `<div class="evo-item"><span class="evo-orb" style="background:radial-gradient(circle at 35% 30%, ${t.gloss}, ${t.fill} 58%, ${t.shade});color:${t.ink}">${t.mark}</span><span>${t.name}</span></div>`
      + (i < TIERS.length - 1 ? '<span class="evo-arrow">›</span>' : '')
    )).join('');
  }

  function guideLanding(r) {
    let y = FLOOR - r;
    for (const b of balls) {
      if (Math.abs(b.x - holdX) < b.r + r - 2) y = Math.min(y, b.y - b.r - r);
    }
    return Math.max(DROP_Y, y);
  }

  function rr(x, y, w, h, rad) {
    const r = Math.min(rad, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground(t) {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#3c1730');
    sky.addColorStop(0.42, '#6a2740');
    sky.addColorStop(1, '#2a120c');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
      const tw = 0.35 + Math.sin(t * 2 + s.p) * 0.35;
      ctx.fillStyle = `rgba(255, 236, 200, ${0.25 + tw})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
      ctx.fill();
    }
    drawLantern(28, 102, t, '#ff5d6c');
    drawLantern(452, 92, t + 1.4, '#ffb703');
    ctx.fillStyle = '#3b2016';
    ctx.fillRect(0, FLOOR + 46, W, H - FLOOR - 46);
    ctx.fillStyle = '#4e2a1c';
    ctx.beginPath();
    ctx.ellipse(W / 2, FLOOR + 40, 220, 24, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawLantern(x, y, t, color) {
    const sway = Math.sin(t * 1.3 + x) * 7;
    ctx.save();
    ctx.translate(x + sway, y);
    ctx.strokeStyle = 'rgba(255, 214, 160, 0.7)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-sway, -30);
    ctx.lineTo(0, 0);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(0, 20, 14, 20, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.ellipse(-4, 14, 4, 8, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f4d7a2';
    ctx.fillRect(-8, 4, 16, 4);
    ctx.fillRect(-8, 34, 16, 3);
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 40);
    ctx.lineTo(0, 54);
    ctx.stroke();
    ctx.restore();
  }

  function drawPot() {
    ctx.save();
    rr(LEFT - 18, RIM - 6, RIGHT - LEFT + 36, FLOOR - RIM + 34, 36);
    const wood = ctx.createLinearGradient(LEFT, RIM, RIGHT, FLOOR);
    wood.addColorStop(0, '#8d4b32');
    wood.addColorStop(0.5, '#5c2e24');
    wood.addColorStop(1, '#3d1d16');
    ctx.fillStyle = wood;
    ctx.fill();
    rr(LEFT, RIM + 8, RIGHT - LEFT, FLOOR - RIM - 4, 26);
    const inner = ctx.createLinearGradient(0, RIM, 0, FLOOR);
    inner.addColorStop(0, '#6a341c');
    inner.addColorStop(1, '#2a140e');
    ctx.fillStyle = inner;
    ctx.fill();
    ctx.save();
    ctx.clip();
    const broth = ctx.createRadialGradient(W / 2, FLOOR - 20, 10, W / 2, FLOOR, 180);
    broth.addColorStop(0, 'rgba(255, 186, 110, 0.28)');
    broth.addColorStop(1, 'rgba(255, 186, 110, 0)');
    ctx.fillStyle = broth;
    ctx.fillRect(LEFT, FLOOR - 120, RIGHT - LEFT, 120);
    ctx.restore();
    ctx.restore();
  }

  function drawRim() {
    ctx.save();
    ctx.strokeStyle = '#f0c56e';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(LEFT - 8, RIM + 2);
    ctx.lineTo(RIGHT + 8, RIM + 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,248,220,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(LEFT + 6, RIM - 1);
    ctx.lineTo(RIGHT - 6, RIM - 1);
    ctx.stroke();
    ctx.restore();
  }

  function drawBall(b) {
    const t = TIERS[b.tier];
    const grow = Math.min(1, 0.58 + Math.min(b.age, 0.12) / 0.12 * 0.42);
    const r = b.r * grow;
    ctx.save();
    ctx.fillStyle = 'rgba(40, 12, 8, 0.18)';
    ctx.beginPath();
    ctx.ellipse(b.x, b.y + r * 0.86, r * 0.7, r * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
    const g = ctx.createRadialGradient(b.x - r * 0.34, b.y - r * 0.4, r * 0.1, b.x, b.y, r);
    g.addColorStop(0, t.gloss);
    g.addColorStop(0.42, t.fill);
    g.addColorStop(1, t.shade);
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(b.x - r * 0.28, b.y - r * 0.36, r * 0.26, r * 0.15, -0.6, 0, Math.PI * 2);
    ctx.fill();
    if (b.tier === 0) {
      ctx.fillStyle = 'rgba(20,10,6,0.38)';
      for (let i = 0; i < 5; i++) {
        const a = i * 1.25 + 0.4;
        ctx.beginPath();
        ctx.arc(b.x + Math.cos(a) * r * 0.38, b.y + Math.sin(a) * r * 0.28, Math.max(1, r * 0.07), 0, 7);
        ctx.fill();
      }
    }
    ctx.fillStyle = t.ink;
    ctx.font = `800 ${Math.max(11, r * 0.72)}px "PingFang SC", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.mark, b.x, b.y + r * 0.04);
    ctx.restore();
  }

  function drawDanger(t) {
    if (state === 'menu') return;
    const pulse = threatening ? 0.45 + Math.abs(Math.sin(t * 6)) * 0.5 : 0.28;
    ctx.save();
    ctx.strokeStyle = threatening ? `rgba(255, 80, 80, ${pulse})` : `rgba(255, 214, 150, ${pulse})`;
    ctx.lineWidth = threatening ? 3 : 2;
    ctx.setLineDash([7, 8]);
    ctx.beginPath();
    ctx.moveTo(LEFT + 12, DANGER);
    ctx.lineTo(RIGHT - 12, DANGER);
    ctx.stroke();
    ctx.restore();
  }

  function drawChopsticks(x, y, r) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#f6e3bf';
    ctx.beginPath();
    ctx.moveTo(x - 28, 156);
    ctx.lineTo(x - r * 0.22, y - r * 0.05);
    ctx.moveTo(x + 32, 148);
    ctx.lineTo(x + r * 0.24, y - r * 0.12);
    ctx.stroke();
    ctx.restore();
  }

  function drawHeld(t) {
    const tier = holdTier;
    const r = TIERS[tier].r;
    const y = DROP_Y + Math.sin(t * 3) * 2;
    drawChopsticks(holdX, y, r);
    if (canDropNow()) {
      const land = guideLanding(r);
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 236, 210, 0.35)';
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(holdX, y + r);
      ctx.lineTo(holdX, land);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.38;
      drawBall({ tier, x: holdX, y: land, r, age: 1 });
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = canDropNow() ? 1 : 0.48;
    drawBall({ tier, x: holdX, y, r, age: 1 });
    ctx.restore();
  }

  function drawSteam() {
    for (const s of steams) {
      const p = s.age / s.life;
      ctx.fillStyle = `rgba(255,255,255,${(1 - p) * 0.13})`;
      ctx.beginPath();
      ctx.arc(s.x + Math.sin(s.age * 2 + s.sway) * 12, s.y - s.age * 64, 7 + p * 14, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFx() {
    for (const p of particles) {
      const a = 1 - p.age / p.life;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const f of floaters) {
      const a = 1 - f.age / f.life;
      ctx.globalAlpha = Math.max(0, a);
      ctx.font = '800 18px "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(80, 24, 20, 0.35)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawDecor() {
    const row = [0, 1, 3, 2, 5, 4];
    let x = 78;
    for (const tier of row) {
      const r = TIERS[tier].r;
      x += r;
      if (x + r > RIGHT - 10) break;
      drawBall({ tier, x, y: FLOOR - r, r, age: 1 });
      x += r + 10;
    }
  }

  function draw(t) {
    const jx = shake > 0.4 ? (Math.random() - 0.5) * shake : 0;
    const jy = shake > 0.4 ? (Math.random() - 0.5) * shake * 0.6 : 0;
    drawBackground(t);
    ctx.save();
    ctx.translate(jx, jy);
    drawPot();
    drawRim();
    drawSteam();
    drawDanger(t);
    if (state === 'menu') drawDecor();
    else {
      const view = balls.slice().sort((a, b) => a.y - b.y);
      for (const b of view) drawBall(b);
    }
    if (state === 'play' || state === 'pause') drawHeld(t);
    ctx.restore();
    drawFx();
  }

  function update(dt) {
    if (state === 'play') {
      if (keys.left) aimX -= 520 * dt;
      if (keys.right) aimX += 520 * dt;
      aimX = clampX(aimX, holdTier);
      holdX += (aimX - holdX) * Math.min(1, dt * 16);
      holdX = clampX(holdX, holdTier);
      dropLock -= dt;
      physics(dt);
      checkDanger(dt);
    }
    if (steams.length < 6 && Math.random() < dt * 2.2) {
      steams.push({
        x: LEFT + 24 + Math.random() * (RIGHT - LEFT - 48),
        y: FLOOR - 16,
        age: 0,
        life: 2.1 + Math.random(),
        sway: Math.random() * 6
      });
    }
    for (const s of steams) s.age += dt;
    steams = steams.filter((s) => s.age < s.life);
    for (const p of particles) {
      p.age += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 280 * dt;
    }
    particles = particles.filter((p) => p.age < p.life);
    for (const f of floaters) {
      f.age += dt;
      f.y -= 32 * dt;
    }
    floaters = floaters.filter((f) => f.age < f.life);
    if (shake > 0) shake = Math.max(0, shake - dt * 28);
    paintHud();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw(now / 1000);
    requestAnimationFrame(loop);
  }

  function canvasX(e) {
    const rect = canvas.getBoundingClientRect();
    return ((e.clientX - rect.left) / rect.width) * W;
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (state !== 'play') return;
    aiming = true;
    aimX = canvasX(e);
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!aiming || state !== 'play') return;
    aimX = canvasX(e);
  });
  canvas.addEventListener('pointerup', (e) => {
    if (!aiming) return;
    aiming = false;
    aimX = canvasX(e);
    tryDrop();
  });
  canvas.addEventListener('pointercancel', () => { aiming = false; });

  window.addEventListener('keydown', (e) => {
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if ((e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && !e.repeat) tryDrop();
    if (e.key === 'Escape') togglePause();
    if ((e.key === 'm' || e.key === 'M') && !e.repeat) muteBtn.click();
    if (state === 'menu' && (e.key === 'Enter' || e.key === ' ') && !e.repeat) startGame();
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });

  function holdButton(btn, key) {
    const down = (e) => { e.preventDefault(); keys[key] = true; ensureAudio(); };
    const up = () => { keys[key] = false; };
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointerleave', up);
    btn.addEventListener('pointercancel', up);
  }
  holdButton(document.getElementById('btn-left'), 'left');
  holdButton(document.getElementById('btn-right'), 'right');
  document.getElementById('btn-drop').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    tryDrop();
  });

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('retry-btn').addEventListener('click', startGame);
  document.getElementById('menu-btn').addEventListener('click', openMenu);
  document.getElementById('resume-btn').addEventListener('click', togglePause);
  muteBtn.addEventListener('click', () => {
    save.muted = !save.muted;
    persist();
    paintMute();
    if (!save.muted) ensureAudio();
  });
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  document.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => b.blur()));

  buildEvo();
  paintMute();
  paintMenuBest();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

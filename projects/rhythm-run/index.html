<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节奏跑酷</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }
        canvas {
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(255, 0, 200, 0.3);
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .overlay.hidden { display: none; }
        .menu {
            text-align: center;
            background: rgba(15,15,40,0.95);
            padding: 40px 50px;
            border-radius: 20px;
            border: 1px solid rgba(255,0,200,0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .menu h1 {
            font-size: 42px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff006e, #fb5607, #ffbe0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .menu h2 { font-size: 30px; color: #ff006e; margin-bottom: 10px; }
        .menu p { color: #aaa; margin-bottom: 20px; font-size: 15px; }
        .btn {
            display: inline-block;
            padding: 14px 35px;
            margin: 8px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn-play {
            background: linear-gradient(135deg, #ff006e, #fb5607);
            color: white;
            box-shadow: 0 4px 20px rgba(255, 0, 110, 0.5);
        }
        .btn-retry {
            background: linear-gradient(135deg, #3a0ca3, #7209b7);
            color: white;
            box-shadow: 0 4px 15px rgba(114, 9, 183, 0.4);
        }
        .score-display { font-size: 50px; color: #ffbe0b; margin: 10px 0; font-weight: bold; }
        .best-display { font-size: 16px; color: #888; margin-bottom: 15px; }
        .controls-hint { margin-top: 15px; font-size: 13px; color: #666; line-height: 1.8; }
        .level-select { margin: 15px 0; }
        .level-btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid rgba(255,0,110,0.5);
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
            color: #fff;
            transition: all 0.2s;
        }
        .level-btn:hover, .level-btn.active {
            background: rgba(255,0,110,0.3);
            border-color: #ff006e;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>

    <div class="overlay" id="start-overlay">
        <div class="menu">
            <h1>节奏跑酷</h1>
            <p>跟着节拍跳跃！踩准时机越过每个障碍！</p>
            <div class="level-select">
                <button class="level-btn active" onclick="selectLevel(0)">慢速入门</button>
                <button class="level-btn" onclick="selectLevel(1)">中等节奏</button>
                <button class="level-btn" onclick="selectLevel(2)">快速挑战</button>
            </div>
            <button class="btn btn-play" onclick="startGame()">开始跑酷</button>
            <div class="controls-hint">
                <p>空格 / ↑ / 点击屏幕 = 跳跃</p>
                <p>长按 = 高跳 | 跟着节拍闪光跳效果最好</p>
            </div>
        </div>
    </div>

    <div class="overlay hidden" id="dead-overlay">
        <div class="menu">
            <h2>撞到了！</h2>
            <div class="score-display" id="final-score">0</div>
            <div class="best-display" id="best-score"></div>
            <p id="progress-text"></p>
            <button class="btn btn-play" onclick="startGame()">再来一次</button>
            <button class="btn btn-retry" onclick="showStart()">选关</button>
        </div>
    </div>

    <div class="overlay hidden" id="win-overlay">
        <div class="menu">
            <h2 style="color:#ffbe0b;">完美通关！</h2>
            <div class="score-display" id="win-score">0</div>
            <div class="best-display" id="win-best"></div>
            <button class="btn btn-play" onclick="nextSong()">下一首</button>
            <button class="btn btn-retry" onclick="showStart()">选关</button>
        </div>
    </div>

    <script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 900;
canvas.height = 500;

// Audio context for beat generation
let audioCtx = null;
let selectedLevel = 0;
let running = false;
let score, combo, maxCombo, distance, totalDistance;
let player, obstacles, particles, beatParticles;
let gameSpeed, baseSpeed, beatInterval, beatTimer, beatPhase;
let jumpHeld, jumpHeldTime;
let highScores = [0, 0, 0];
try { highScores = JSON.parse(localStorage.getItem('rhythm_high') || '[0,0,0]'); } catch(e) {}

// Level definitions
const levelDefs = [
    { name: '慢速入门', bpm: 100, speed: 5, obstacles: 'easy', color: '#00ff88' },
    { name: '中等节奏', bpm: 130, speed: 6.5, obstacles: 'medium', color: '#ff006e' },
    { name: '快速挑战', bpm: 160, speed: 8, obstacles: 'hard', color: '#ffbe0b' },
];

// Beat sound
function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playBeat(freq, duration, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playJumpSound() {
    playBeat(440, 0.1, 0.1);
    playBeat(660, 0.08, 0.08);
}

function playHitSound() {
    playBeat(100, 0.3, 0.2);
    playBeat(80, 0.4, 0.15);
}

function playBeatTick(strong) {
    if (strong) {
        playBeat(800, 0.05, 0.12);
    } else {
        playBeat(600, 0.03, 0.06);
    }
}

// Player
function resetPlayer() {
    player = {
        x: 120, y: 350, w: 30, h: 30,
        vy: 0, grounded: true,
        rotation: 0, targetRotation: 0,
        trail: []
    };
}

// Obstacle patterns
function generateObstacles(difficulty) {
    const obs = [];
    const level = levelDefs[selectedLevel];
    const beatDist = level.speed * (60 / level.bpm) * 60; // distance per beat in pixels

    let x = 800;
    const totalBeats = difficulty === 'easy' ? 60 : difficulty === 'medium' ? 80 : 100;
    totalDistance = totalBeats * beatDist + 400;

    for (let beat = 4; beat < totalBeats; beat++) {
        const bx = 800 + beat * beatDist;
        let spawn = false;
        let type = 'block';
        let h = 30;

        if (difficulty === 'easy') {
            if (beat % 4 === 0 && Math.random() < 0.7) spawn = true;
            h = 30;
        } else if (difficulty === 'medium') {
            if (beat % 3 === 0 && Math.random() < 0.7) spawn = true;
            if (beat % 6 === 0 && Math.random() < 0.4) { type = 'tall'; h = 55; }
            if (beat % 8 === 0 && Math.random() < 0.3) type = 'double';
        } else {
            if (beat % 2 === 0 && Math.random() < 0.65) spawn = true;
            if (beat % 4 === 0 && Math.random() < 0.5) { type = 'tall'; h = 60; }
            if (beat % 6 === 0 && Math.random() < 0.4) type = 'double';
            if (beat % 8 === 0 && Math.random() < 0.3) type = 'spike_row';
        }

        if (spawn) {
            if (type === 'double') {
                obs.push({x: bx, y: 380 - 30, w: 30, h: 30, type: 'block', passed: false});
                obs.push({x: bx + beatDist * 0.5, y: 380 - 30, w: 30, h: 30, type: 'block', passed: false});
            } else if (type === 'spike_row') {
                obs.push({x: bx, y: 380 - 20, w: 60, h: 20, type: 'spike', passed: false});
            } else {
                obs.push({x: bx, y: 380 - h, w: 30, h: h, type: type, passed: false});
            }
        }
    }
    return obs;
}

function selectLevel(idx) {
    selectedLevel = idx;
    document.querySelectorAll('.level-btn').forEach((b, i) => {
        b.classList.toggle('active', i === idx);
    });
}

function startGame() {
    initAudio();
    const level = levelDefs[selectedLevel];
    gameSpeed = level.speed;
    baseSpeed = level.speed;
    beatInterval = 60 / level.bpm * 1000; // ms per beat
    beatTimer = 0;
    beatPhase = 0;

    score = 0;
    combo = 0;
    maxCombo = 0;
    distance = 0;
    jumpHeld = false;
    jumpHeldTime = 0;

    resetPlayer();
    obstacles = generateObstacles(level.obstacles);
    particles = [];
    beatParticles = [];
    running = true;

    document.getElementById('start-overlay').classList.add('hidden');
    document.getElementById('dead-overlay').classList.add('hidden');
    document.getElementById('win-overlay').classList.add('hidden');

    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function showStart() {
    running = false;
    document.getElementById('dead-overlay').classList.add('hidden');
    document.getElementById('win-overlay').classList.add('hidden');
    document.getElementById('start-overlay').classList.remove('hidden');
}

function nextSong() {
    selectedLevel = Math.min(selectedLevel + 1, levelDefs.length - 1);
    startGame();
}

// Input
let jumpPressed = false;
window.addEventListener('keydown', e => {
    if ((e.code === 'Space' || e.code === 'ArrowUp') && !jumpPressed) {
        e.preventDefault();
        jumpPressed = true;
        doJump();
    }
});
window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') jumpPressed = false;
});
canvas.addEventListener('mousedown', e => { if (!jumpPressed) { jumpPressed = true; doJump(); } });
canvas.addEventListener('mouseup', () => { jumpPressed = false; });
canvas.addEventListener('touchstart', e => { e.preventDefault(); if (!jumpPressed) { jumpPressed = true; doJump(); } });
canvas.addEventListener('touchend', e => { jumpPressed = false; });

function doJump() {
    if (!running) return;
    if (player.grounded) {
        // Check if jump is on beat
        const beatProgress = beatPhase % 1;
        const onBeat = beatProgress < 0.15 || beatProgress > 0.85;

        if (onBeat) {
            player.vy = -14;
            combo++;
            maxCombo = Math.max(maxCombo, combo);
            score += 10 * Math.min(combo, 10);
            spawnBeatParticles(player.x, player.y, true);
        } else {
            player.vy = -12;
            combo = 0;
            score += 5;
            spawnBeatParticles(player.x, player.y, false);
        }
        player.grounded = false;
        player.targetRotation += Math.PI * 2;
        playJumpSound();
    }
}

// Particles
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y, vx: (Math.random()-0.5)*8, vy: (Math.random()-1)*6,
            life: 30+Math.random()*20, color, size: 3+Math.random()*4
        });
    }
}

function spawnBeatParticles(x, y, onBeat) {
    const color = onBeat ? '#ffbe0b' : '#666';
    const count = onBeat ? 12 : 4;
    for (let i = 0; i < count; i++) {
        beatParticles.push({
            x: x + Math.random()*20-10, y: y + 20,
            vx: (Math.random()-0.5)*4, vy: -Math.random()*5 - 2,
            life: 25+Math.random()*15, color, size: onBeat ? 4+Math.random()*4 : 2+Math.random()*2
        });
    }
}

// Game loop
let lastTime = 0;
const GROUND_Y = 380;
const GRAVITY = 0.65;

function gameLoop(time) {
    if (!running) return;
    const dt = Math.min(time - lastTime, 32);
    lastTime = time;

    // Beat tracking
    beatTimer += dt;
    beatPhase = beatTimer / beatInterval;
    if (beatTimer >= beatInterval) {
        beatTimer -= beatInterval;
        const strong = Math.floor(beatPhase) % 4 === 0;
        playBeatTick(strong);
    }

    // Update player
    player.vy += GRAVITY;
    player.y += player.vy;
    if (player.y >= GROUND_Y - player.h) {
        player.y = GROUND_Y - player.h;
        player.vy = 0;
        player.grounded = true;
    }

    // Rotation animation
    player.rotation += (player.targetRotation - player.rotation) * 0.15;

    // Trail
    player.trail.push({x: player.x + player.w/2, y: player.y + player.h/2, alpha: 0.6});
    if (player.trail.length > 15) player.trail.shift();
    player.trail.forEach(t => t.alpha -= 0.04);

    // Move obstacles
    distance += gameSpeed;
    for (let obs of obstacles) {
        obs.x -= gameSpeed;

        // Score for passing
        if (!obs.passed && obs.x + obs.w < player.x) {
            obs.passed = true;
        }
    }

    // Collision
    for (let obs of obstacles) {
        if (obs.x > player.x + player.w + 5 || obs.x + obs.w < player.x - 5) continue;
        if (obs.x + obs.w > player.x + 3 && obs.x < player.x + player.w - 3 &&
            obs.y + obs.h > player.y + 5 && obs.y < player.y + player.h - 2) {
            die();
            return;
        }
    }

    // Check win
    if (distance >= totalDistance) {
        win();
        return;
    }

    // Update particles
    for (let i = particles.length-1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.2;
        p.life--; p.size *= 0.96;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = beatParticles.length-1; i >= 0; i--) {
        const p = beatParticles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.1;
        p.life--; p.size *= 0.95;
        if (p.life <= 0) beatParticles.splice(i, 1);
    }

    // Speed increase over time
    gameSpeed = baseSpeed + distance * 0.0003;

    draw();
    requestAnimationFrame(gameLoop);
}

function die() {
    running = false;
    playHitSound();
    spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff006e', 20);

    const finalScore = score;
    if (finalScore > highScores[selectedLevel]) {
        highScores[selectedLevel] = finalScore;
        localStorage.setItem('rhythm_high', JSON.stringify(highScores));
    }

    setTimeout(() => {
        document.getElementById('final-score').textContent = finalScore;
        document.getElementById('best-score').textContent = `最高分: ${highScores[selectedLevel]} | 最大连击: ${maxCombo}`;
        document.getElementById('progress-text').textContent =
            `进度: ${Math.floor(distance/totalDistance*100)}%`;
        document.getElementById('dead-overlay').classList.remove('hidden');
    }, 600);
}

function win() {
    running = false;
    const finalScore = score + 500; // bonus
    if (finalScore > highScores[selectedLevel]) {
        highScores[selectedLevel] = finalScore;
        localStorage.setItem('rhythm_high', JSON.stringify(highScores));
    }
    setTimeout(() => {
        document.getElementById('win-score').textContent = finalScore;
        document.getElementById('win-best').textContent = `最大连击: ${maxCombo} | 最高分: ${highScores[selectedLevel]}`;
        document.getElementById('win-overlay').classList.remove('hidden');
    }, 400);
}

// Drawing
function draw() {
    const level = levelDefs[selectedLevel];
    const beatPulse = Math.sin(beatPhase * Math.PI * 2) * 0.5 + 0.5;

    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Beat pulse background
    ctx.fillStyle = `rgba(${level.color === '#00ff88' ? '0,255,136' : level.color === '#ff006e' ? '255,0,110' : '255,190,11'}, ${beatPulse * 0.03})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid lines (moving)
    ctx.strokeStyle = `rgba(255,255,255, 0.03)`;
    const gridOffset = distance % 50;
    for (let x = -gridOffset; x < canvas.width; x += 50) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }

    // Ground
    ctx.fillStyle = '#1a1a3a';
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
    ctx.strokeStyle = level.color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.5 + beatPulse * 0.5;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(canvas.width, GROUND_Y); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;

    // Beat indicator at top
    const beatAlpha = beatPulse;
    ctx.fillStyle = `rgba(${level.color === '#00ff88' ? '0,255,136' : level.color === '#ff006e' ? '255,0,110' : '255,190,11'}, ${beatAlpha * 0.8})`;
    ctx.fillRect(canvas.width/2 - 30, 10, 60, 6);

    // Obstacles
    for (let obs of obstacles) {
        if (obs.x < -50 || obs.x > canvas.width + 50) continue;
        ctx.save();
        if (obs.type === 'spike') {
            ctx.fillStyle = '#ff006e';
            for (let i = 0; i < obs.w; i += 15) {
                ctx.beginPath();
                ctx.moveTo(obs.x + i, obs.y + obs.h);
                ctx.lineTo(obs.x + i + 7.5, obs.y);
                ctx.lineTo(obs.x + i + 15, obs.y + obs.h);
                ctx.fill();
            }
        } else {
            const gradient = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.h);
            gradient.addColorStop(0, level.color);
            gradient.addColorStop(1, '#1a1a3a');
            ctx.fillStyle = gradient;
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.strokeStyle = level.color;
            ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
        }
        ctx.restore();
    }

    // Player trail
    for (let t of player.trail) {
        if (t.alpha <= 0) continue;
        ctx.save();
        ctx.globalAlpha = t.alpha * 0.3;
        ctx.fillStyle = level.color;
        ctx.fillRect(t.x - 5, t.y - 5, 10, 10);
        ctx.restore();
    }

    // Player
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    ctx.rotate(player.rotation);
    // Glow
    ctx.shadowColor = level.color;
    ctx.shadowBlur = 15 + beatPulse * 10;
    ctx.fillStyle = level.color;
    ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
    ctx.shadowBlur = 0;
    // Inner
    ctx.fillStyle = '#fff';
    ctx.fillRect(-player.w/2 + 4, -player.h/2 + 4, player.w - 8, player.h - 8);
    ctx.restore();

    // Beat particles
    for (let p of beatParticles) {
        ctx.save();
        ctx.globalAlpha = p.life / 40;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // Death particles
    for (let p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
        ctx.restore();
    }

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Arial';
    ctx.fillText(`分数: ${score}`, 15, 35);
    ctx.fillStyle = combo >= 3 ? '#ffbe0b' : '#888';
    ctx.font = '14px Arial';
    ctx.fillText(`连击: ${combo}x`, 15, 55);

    // Progress bar
    const prog = Math.min(distance / totalDistance, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(200, 15, 500, 8);
    ctx.fillStyle = level.color;
    ctx.fillRect(200, 15, 500 * prog, 8);
    ctx.fillStyle = '#fff';
    ctx.font = '12px Arial';
    ctx.textAlign = 'right';
    ctx.fillText(`${Math.floor(prog*100)}%`, 720, 24);
    ctx.textAlign = 'left';

    // Combo flash
    if (combo >= 5) {
        ctx.save();
        ctx.globalAlpha = 0.5 + beatPulse * 0.3;
        ctx.fillStyle = '#ffbe0b';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(`${combo}x 连击！`, canvas.width/2, 470);
        ctx.textAlign = 'left';
        ctx.restore();
    }
}

// Initial draw
ctx.fillStyle = '#0a0a1a';
ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
</html>
